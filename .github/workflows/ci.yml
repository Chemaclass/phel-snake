on: [push]

name: CI

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress
      - name: Check format, lint and test
        run: composer ci
